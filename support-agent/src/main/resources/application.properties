spring.application.name=support-agent

# Where Ollama runs (default is localhost:11434 anyway, but be explicit)
spring.ai.ollama.base-url=http://localhost:11434

# Which model to use
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.temperature=0.2


# Postgres from docker compose (note port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/agentlab
spring.datasource.username=agent
spring.datasource.password=agent

spring.config.import=optional:file:../agent-config/${AGENT_VERSION:v1}.yml